    <ellipse cx="92" cy="90" rx="109" ry="92" transform="rotate(29 92 90)" stroke="#abade6" stroke-opacity=".28" stroke-width="1.5"/>
    <path d="M92 28L143 59V120L92 151L41 120V59ZM41 59L92 90L143 59M92 90V151" stroke="#a4d4e6" stroke-width="2.5"/>
    <path d="M92 28V90M41 120L92 90L143 120" stroke="#a4d4e6" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="-16" cy="141" r="5" fill="#9fe2ca" stroke="none"/>
    <circle cx="206" cy="32" r="4" fill="#cbbaf5" stroke="none"/>
